# /etc/nginx/sites-available/nasa2026.scsonic.com
# Cloudflare proxy (orange cloud) + SSL mode "Full (strict)".
# Browser --HTTPS(Cloudflare cert)--> Cloudflare --HTTPS(Origin cert)--> nginx --HTTP--> uvicorn :8200

server {
    listen 80;
    listen [::]:80;
    server_name nasa2026.scsonic.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx < 1.25.1: remove this line and write "listen 443 ssl http2;"
    server_name nasa2026.scsonic.com;

    # Cloudflare Origin Certificate (Cloudflare dashboard > SSL/TLS > Origin Server).
    ssl_certificate     /etc/ssl/cloudflare/scsonic.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/scsonic.com.key;

    include snippets/cloudflare-realip.conf;

    access_log /var/log/nginx/nasa2026.access.log;
    error_log  /var/log/nginx/nasa2026.error.log;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;   # real visitor IP (via realip)
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
